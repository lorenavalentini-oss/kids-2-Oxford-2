<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kids English Quest · A2</title>
<style>
:root{--ink:#203040;--bg:#f7fbf4;--card:#fff;--accent:#65b84b;--soft:#eaf7e4;--yellow:#ffd65a;--shadow:0 12px 30px #19351d18}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#f8fff3,#eef8ff);color:var(--ink)}button{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}.top{padding:14px 20px;display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid #dcebd7;position:sticky;top:0;z-index:4}.brand{font-weight:900}.bar{height:9px;background:#e7eee4;border-radius:99px;flex:1;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}.counter{font-weight:800;font-size:.9rem}.stage{width:min(1000px,94vw);margin:auto;padding:28px 0}.slide{display:none;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,54px);min-height:610px;position:relative;overflow:hidden}.slide.active{display:block;animation:in .3s ease}@keyframes in{from{opacity:.3;transform:translateX(18px)}to{opacity:1;transform:none}}.eyebrow{font-weight:900;color:#4f9f3b;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}.hero h1,.slide h2{font-size:clamp(2rem,5vw,4.4rem);line-height:1;margin:.25em 0}.slide h2{font-size:clamp(1.8rem,4vw,3rem)}.lead{font-size:1.15rem;max-width:720px;line-height:1.55}.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:28px}.unitbtn,.choice,.chip,.matchbtn{border:0;border-radius:18px;padding:18px;background:var(--soft);font-weight:800;cursor:pointer;transition:.18s}.unitbtn:hover,.choice:hover,.chip:hover,.matchbtn:hover{transform:translateY(-2px);box-shadow:0 7px 16px #1c38151f}.unitbtn b{display:block;font-size:1.25rem}.unitbtn small{font-weight:600}.game{margin-top:25px;padding:22px;border-radius:22px;background:#f8fbff;border:2px dashed #cfe2ef}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.choice.ok{background:#c9f2c3}.choice.bad{background:#ffd2d2}.feedback{min-height:30px;font-weight:900;margin-top:14px}.chips{display:flex;gap:10px;flex-wrap:wrap}.chip.selected{outline:4px solid var(--yellow)}.sentence{font-size:1.3rem;padding:18px;background:white;border-radius:16px;margin:12px 0}.prompt{font-size:1.45rem;font-weight:900;margin:18px 0}.nav{display:flex;justify-content:space-between;gap:12px;width:min(1000px,94vw);margin:0 auto 25px}.nav button{border:0;border-radius:999px;padding:14px 22px;font-weight:900;cursor:pointer}.prev{background:#e9eef1}.next{background:var(--ink);color:white}.home{background:var(--yellow)!important;color:#332b10}.wordwall{margin-top:22px;background:#fff8d9;border-radius:22px;padding:20px}.wordwall a{display:inline-block;margin-top:8px;background:#6941c6;color:white;text-decoration:none;padding:13px 18px;border-radius:999px;font-weight:900}.note{font-size:.86rem;color:#61717d}.bigemoji{font-size:5rem}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}.score{font-size:1.2rem;font-weight:900}.speak{background:#eef7ff;border-left:7px solid #6bb5e9;padding:18px;border-radius:16px}.footerNote{position:absolute;bottom:18px;right:24px;color:#82918a;font-size:.78rem}@media(max-width:700px){.slide{min-height:670px}.two{grid-template-columns:1fr}.top{padding:10px}.brand{display:none}}
</style>
</head>
<body><div class="app"><header class="top"><div class="brand">🎮 KIDS ENGLISH QUEST · A2</div><div class="bar"><i id="prog"></i></div><div class="counter" id="counter"></div></header><main class="stage" id="stage"></main><nav class="nav"><button class="prev" onclick="move(-1)">← BACK</button><button class="home" onclick="go(0)">⌂ HOME</button><button class="next" onclick="move(1)">NEXT →</button></nav></div>
<script>
const U=[
{n:'START',t:'Who are you?',sub:'Personal information · greetings · jobs & places',icon:'👋',grammar:'Verb to be + possessives',vocab:['name','age','country','teacher','doctor','student','school','hospital'],q:[['I ___ 11 years old.','am',['is','are']],['She ___ a student.','is',['am','are']],['They ___ my friends.','are',['is','am']]],speak:'Introduce yourself: name, age, where you are from, and one thing you like.',ww:'https://wordwall.net/en-us/community/personal-information-questions'},
{n:'UNIT 1',t:'My Day in Action',sub:'Daily routines · actions happening now',icon:'⏰',grammar:'Present Simple + Present Continuous',vocab:['wake up','get dressed','have breakfast','go to school','have lunch','watch TV','go to bed','play'],q:[['I ___ to school every day.','go',['am going','goes']],['Look! He ___ football now.','is playing',['plays','play']],['She ___ breakfast at 7.','has',['have','is having']]],speak:'Tell your partner 3 things you do every day and 2 things people are doing now.',ww:'https://wordwall.net/en-us/community/daily-routines-present-simple'},
{n:'UNIT 2',t:'Future Me!',sub:'Plans · predictions · wishes & goals',icon:'🔮',grammar:'Be going to + will + would like to',vocab:['tomorrow','weekend','morning','afternoon','evening','travel','learn','celebrate'],q:[['I ___ visit my grandma on Saturday.','am going to',['will to','going']],['I think robots ___ help us more.','will',['are','do']],['I ___ to learn Japanese.','would like',['would likes','am like']]],speak:'What are you going to do this weekend? Make one fun prediction about 2035.',ww:'https://wordwall.net/en-us/community/be-going-to-future-plans'},
{n:'UNIT 3',t:'Travel Time Machine',sub:'Places · vacations · trips · past events',icon:'✈️',grammar:'Past Simple: was/were + regular & irregular verbs',vocab:['airport','trip','hotel','journey','arrive','leave','meet','fly'],q:[['Yesterday we ___ at the beach.','were',['was','are']],['She ___ to London last year.','went',['go','goed']],['Did you ___ by plane?','travel',['traveled','travels']]],speak:'Talk about your last trip: Where did you go? Who were you with? What did you do?',ww:'https://wordwall.net/en-us/community/past-simple-travel'},
{n:'UNIT 4',t:'Shopping Challenge',sub:'Compare · choose · shop · ask for things',icon:'🛍️',grammar:'Comparatives · superlatives · quantifiers · requests',vocab:['cheap','expensive','big','small','better','best','much','many'],q:[['A bike is ___ than a car.','cheaper',['cheapest','cheap']],['This is the ___ game here!','best',['better','good']],['How ___ water do you need?','much',['many','more']]],speak:'Compare two things you own. Then role-play a shop: customer + shop assistant.',ww:'https://wordwall.net/en-us/community/comparatives-superlatives'}
];
let slides=[],cur=0,score=0;
function esc(s){return s.replaceAll("'","\\'")}
function build(){slides=[`<section class="slide hero active"><div class="eyebrow">One topic · one journey · one screen at a time</div><div class="bigemoji">🚀</div><h1>English Quest</h1><p class="lead">Choose a unit. Vocabulary, grammar and speaking stay together inside the same mission. Play, answer and speak!</p><div class="units">${U.map((u,i)=>`<button class="unitbtn" onclick="go(${1+i*4})"><span>${u.icon}</span><b>${u.n}</b><small>${u.t}</small></button>`).join('')}</div><p class="note">Teacher mode: use BACK / NEXT to project one screen at a time.</p></section>`];
U.forEach((u,ui)=>{let base=1+ui*4;slides.push(`<section class="slide"><div class="eyebrow">${u.n} · Mission 1</div><div class="two"><div><div class="bigemoji">${u.icon}</div><h2>${u.t}</h2><p class="lead">${u.sub}</p><div class="speak"><b>🎯 Today I can…</b><br>understand the key words, use <b>${u.grammar}</b>, and speak about the topic.</div></div><div class="game"><h3>⚡ Vocabulary Tap</h3><p>Read the words aloud. Tap each one when the group explains or acts it out.</p><div class="chips">${u.vocab.map(x=>`<button class="chip" onclick="this.classList.toggle('selected')">${x}</button>`).join('')}</div></div></div><div class="footerNote">${u.n} · vocabulary + context</div></section>`);
slides.push(`<section class="slide"><div class="eyebrow">${u.n} · Mission 2</div><h2>Grammar Power ⚙️</h2><p class="lead"><b>${u.grammar}</b> — use it to talk about <i>${u.sub.toLowerCase()}</i>.</p><div class="game"><div class="prompt" id="qp${ui}">${u.q[0][0]}</div><div class="choices" id="qc${ui}">${shuffle([u.q[0][1],...u.q[0][2]]).map(a=>`<button class="choice" onclick="answer(${ui},0,this,'${esc(a)}')">${a}</button>`).join('')}</div><div class="feedback" id="qf${ui}">Choose an answer.</div></div><p class="note">The next question appears after a correct answer.</p></section>`);
slides.push(`<section class="slide"><div class="eyebrow">${u.n} · Mission 3</div><h2>Speak! 🎤</h2><div class="speak"><div class="prompt">${u.speak}</div><p>⭐ Challenge: answer in a full sentence. ⭐⭐ Add a reason or extra detail.</p></div><div class="wordwall"><h3>🎲 Wordwall Practice</h3><p>Open a Wordwall community search connected to this unit. Choose a suitable game for your class.</p><a href="${u.ww}" target="_blank" rel="noopener">OPEN WORDWALL ↗</a><p class="note">External community activities can change; preview the selected activity before class.</p></div></section>`);
slides.push(`<section class="slide"><div class="eyebrow">${u.n} · Final Mission</div><div class="bigemoji">🏆</div><h2>Unit Challenge</h2><p class="lead">Without looking back, use <b>3 vocabulary words</b> + <b>1 sentence with ${u.grammar}</b> + answer the speaking challenge.</p><div class="game"><h3>Team points</h3><button class="unitbtn" onclick="score++;document.getElementById('sc${ui}').textContent=score">➕ Great answer</button> <span class="score">Score: <b id="sc${ui}">${score}</b></span></div><button class="unitbtn" style="margin-top:18px" onclick="go(${ui===U.length-1?0:base+4})">${ui===U.length-1?'🏠 FINISH':'NEXT UNIT →'}</button></section>`);});document.getElementById('stage').innerHTML=slides.join('');update()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let qpos={};function answer(ui,qi,btn,a){let u=U[ui],correct=u.q[qi][1],fb=document.getElementById('qf'+ui);[...btn.parentElement.children].forEach(b=>b.disabled=true);if(a===correct){btn.classList.add('ok');fb.textContent='✅ Correct!';setTimeout(()=>{let n=qi+1;if(n<u.q.length){document.getElementById('qp'+ui).textContent=u.q[n][0];let box=document.getElementById('qc'+ui);box.innerHTML=shuffle([u.q[n][1],...u.q[n][2]]).map(x=>`<button class="choice" onclick="answer(${ui},${n},this,'${esc(x)}')">${x}</button>`).join('');fb.textContent='Next one!'}else fb.textContent='🏆 Grammar mission complete!'},650)}else{btn.classList.add('bad');fb.textContent='Try again — look at the grammar clue.';setTimeout(()=>[...btn.parentElement.children].forEach(b=>b.disabled=false),500)}}
function go(n){document.querySelectorAll('.slide').forEach(x=>x.classList.remove('active'));cur=Math.max(0,Math.min(n,slides.length-1));document.querySelectorAll('.slide')[cur].classList.add('active');update();scrollTo(0,0)}function move(d){go(cur+d)}function update(){document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%'}build();
</script></body></html>
